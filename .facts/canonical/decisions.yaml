# Decisions — cross-cutting decisions that affect multiple categories
category: decisions
tier: working

slots:
  # Each decision is a slot. Use IDs like "dec-001", "dec-002", etc.
  # Example:
  # dec-001:
  #   value:
  #     title: "Choose PostgreSQL over MySQL"
  #     date: "2026-06-07"
  #     status: "active"        # active | superseded | reverted
  #     rationale: "Need JSONB support and better CTE performance"
  #     affected-slots:
  #       - tech-stack.database
  #       - data-model.database-type
  #       - build-deploy.docker
  #     alternatives-considered:
  #       - "MySQL 8 — lacks native JSONB"
  #       - "SQLite — insufficient for concurrent access"
  #   meta:
  #     source: human
  #     confidence: high
  #     status: active
  #     updated: "2026-06-07"
  #     verified: "2026-06-07"
  fl_design_philosophy:
    value:
      title: Preventive architecture for fact management
      date: '2025-12-01'
      status: active
      summary: Schema prevention -> index dedup -> dependency graph -> LLM 
        audit. Unlike reactive approaches that clean up after errors.
      affected-slots:
      - architecture.style
      - tech-stack.data_modeling
    meta:
      source: human
      confidence: high
      status: active
      updated: '2026-07-22'
      verified: '2026-07-22'
      reason: 治理响应:重新 verify(内容仍准确,预防式架构即 FL 现状)刷新 last_verified;不调阈值(tier 议题单列)
  governance-cadence:
    value:
      title: 治理 = 能力 × 触发;先建触发不建工具
      date: '2026-07-22'
      status: active
      summary: FL 提供治理能力(check/audit/impact/未来 warden)但均为自选手动 → 自选=缺席。dogfood 
        实证(2026-07-22 手动跑一次 check+audit):抓到 1 条本 session 漂移(blockers 与 focus 
        矛盾,已修)+ 2 条历史静默(测试计数过期已修;连字符/下划线重复 slot=Bug B 残留=B-003)+ 2 条工具能力缺口(fl 
        check 无悬空边检测=B-001、无依赖边编辑接口=B-002,均已于 2026-07-23 TDD 
        补齐)。⚠勘误(2026-07-23):初记把 B-003 说成'2 条悬空依赖边',是照字面信了 LLM audit 措辞'no such 
        slot exists'——核实后 slot 实际存在(空 stub)、真值在下划线孪生,无结构悬空边,fl check 报 0 
        正确。教训:发现的描述必须核实到结构层,audit 
        自然语言判词不可照字面入账。结论不变:治理须绑定必然触发的时刻(每写入=结构闸阻塞、commit/session 
        收尾=语义+行为审标记、升级给人=残渣),下一步交付触发(commit pre-hook 跑 check)而非再加能力。
      affected-slots: []
    meta:
      source: human
      confidence: high
      status: active
      updated: '2026-07-23'
      verified: '2026-07-23'
      reason: 纠正 dogfood 证据:'悬空边'实为重复slot(B-003);记入 audit 措辞不可照字面的教训;B-001/B-002
        已修
