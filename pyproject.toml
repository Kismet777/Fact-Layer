[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fact-layer"
version = "0.1.0"
description = "Structured, consistency-checked project facts for AI coding agents"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "nokismet" }]
keywords = ["ai", "agent", "facts", "consistency", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Documentation",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "pydantic>=2.0",
    "ruamel.yaml>=0.18",
    "anthropic>=0.30",
    "jinja2>=3.1",
    "fastmcp>=2.0",
]

[project.urls]
Homepage = "https://github.com/Kismet777/Fact-Layer"
Source = "https://github.com/Kismet777/Fact-Layer"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
fl = "fact_layer.cli:app"
fl-mcp = "fact_layer.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fact_layer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
